<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monitor de Postura Interativo</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f0f2f5;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: min-content;
            margin: 0;
            padding: 20px;
            color: #333;
        }
        h1 { margin-bottom: 5px; color: #1a73e8; }
        p { margin-top: 0; color: #666; }
        #btn-start {
            background-color: #1a73e8;
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            transition: background 0.2s;
        }
        #btn-start:hover { background-color: #1557b0; }
        #webcam-container {
            margin: 20px 0;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 8px 16px rgba(0,0,0,0.15);
            background: #000;
            width: 320px;
            height: 320px;
        }
        #webcam-container canvas {
            display: block;
            width: 100%;
            height: 100%;
            object-fit: cover;
            background: #000;
        }
        #status-box {
            font-size: 24px;
            font-weight: bold;
            padding: 15px 30px;
            border-radius: 30px;
            text-transform: uppercase;
            letter-spacing: 1px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            margin-bottom: 20px;
            background-color: #ccc;
            text-align: center;
        }
        .status-ok { background-color: #34a853 !important; color: white; }
        .status-alerta { background-color: #ea4335 !important; color: white; animation: piscar 0.5s infinite alternate; }
        .status-fundo { background-color: #757575 !important; color: white; }
        @keyframes piscar {
            from { opacity: 1; } to { opacity: 0.7; }
        }
        #label-container { font-size: 14px; color: #555; text-align: left; width: 320px; }
        .label-bar { display: flex; justify-content: space-between; margin: 4px 0; }
    </style>
</head>
<body>

    <h1>Monitor de Postura</h1>
    <p>Mantenha-se ereto para evitar o alerta sonoro!</p>
    
    <button id="btn-start" onclick="init()">Iniciar Monitor</button>
    
    <div id="webcam-container"></div>
    <div id="status-box">Aguardando Início...</div>
    <div id="label-container"></div>

    <!-- Carrega as bibliotecas do TensorFlow.js e Teachable Machine -->
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@latest/dist/tf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@latest/dist/image.min.js"></script>

    <script type="text/javascript">
        // ATENÇÃO: Substitua pelo link gerado no seu Teachable Machine
        const URL = "https://teachablemachine.withgoogle.com/models/OY2qUkn4l/";

        let model, webcam, labelContainer, maxPredictions;
        let statusBox = document.getElementById("status-box");
        let tempoEscorado = 0;
        
        // Estes nomes devem bater com as classes exportadas pelo modelo do Teachable Machine.
        // O modelo gerado no exemplo usa os labels: "apoiado", "não apoiado" e "fundo".
        const CLASSE_ERETO = "apoiado";
        const CLASSE_ESCORADO = "não apoiado";
        const CLASSE_FUNDO = "fundo";

        function normalizarLabel(valor) {
            return String(valor)
                .toLowerCase()
                .normalize('NFD')
                .replace(/[\u0300-\u036f]/g, '')
                .trim();
        }

        // Cria o som de bip usando a API de Áudio nativa do navegador
        function emitirBip() {
            const AudioCtx = window.AudioContext || window.webkitAudioContext;
            if (!AudioCtx) return;

            const audioCtx = new AudioCtx();
            const oscillator = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();

            oscillator.connect(gainNode);
            gainNode.connect(audioCtx.destination);

            oscillator.type = 'sine'; 
            oscillator.frequency.setValueAtTime(850, audioCtx.currentTime); // Tom do apito
            gainNode.gain.setValueAtTime(0.3, audioCtx.currentTime); // Volume

            oscillator.start();
            oscillator.stop(audioCtx.currentTime + 0.15); 
        }

        async function init() {
            document.getElementById("btn-start").style.display = "none";
            statusBox.innerHTML = "Carregando modelo...";
            
            const modelURL = URL + "model.json";
            const metadataURL = URL + "metadata.json";

            model = await tmImage.load(modelURL, metadataURL);
            maxPredictions = model.getTotalClasses();

            const flip = true; 
            webcam = new tmImage.Webcam(320, 320, flip); 
            await webcam.setup(); 
            await webcam.play();
            window.requestAnimationFrame(loop);

            document.getElementById("webcam-container").appendChild(webcam.canvas);
            
            labelContainer = document.getElementById("label-container");
            labelContainer.innerHTML = "";
            for (let i = 0; i < maxPredictions; i++) {
                labelContainer.appendChild(document.createElement("div"));
            }
        }

        async function loop() {
            webcam.update(); 
            await predict();
            window.requestAnimationFrame(loop);
        }

        async function predict() {
            const prediction = await model.predict(webcam.canvas);
            
            let probEreto = 0;
            let probEscorado = 0;
            let probFundo = 0;

            // Renderiza as barras de porcentagem e armazena os valores atuais
            for (let i = 0; i < maxPredictions; i++) {
                const className = prediction[i].className;
                const probability = prediction[i].probability;
                const normalize = normalizarLabel(className);
                
                labelContainer.childNodes[i].innerHTML = `
                    <div class="label-bar">
                        <span><strong>${className}:</strong></span> 
                        <span>${(probability * 100).toFixed(0)}%</span>
                    </div>`;

                if (normalize === normalizarLabel(CLASSE_ERETO)) probEreto = probability;
                if (normalize === normalizarLabel(CLASSE_ESCORADO)) probEscorado = probability;
                if (normalize === normalizarLabel(CLASSE_FUNDO)) probFundo = probability;
            }

            // Lógica de tomada de decisão baseada na maior probabilidade
            if (probFundo > 0.60) {
                // Caso a classe "fundo" seja predominante (Ninguém na tela)
                tempoEscorado = 0;
                statusBox.innerHTML = "Ausente 👥";
                statusBox.className = "status-fundo";
            } 
            else if (probEscorado > 0.70) {
                // Aluno se escorou
                tempoEscorado++;
                
                // Exige cerca de 1 a 1.5 segundos contínuos escorado para disparar o alarme
                if (tempoEscorado > 40) { 
                    statusBox.innerHTML = "Postura Incorreta! 🚨";
                    statusBox.className = "status-alerta";
                    
                    // Apita em intervalos regulares enquanto persistir o erro
                    if (tempoEscorado % 25 === 0) {
                        emitirBip();
                    }
                } else {
                    statusBox.innerHTML = "Detectando deslize...";
                }
            } 
            else {
                // Aluno na postura correta ("não escorado")
                tempoEscorado = 0;
                statusBox.innerHTML = "Postura OK ✔";
                statusBox.className = "status-ok";
            }
        }
    </script>
</body>
</html>
